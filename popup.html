<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Betaal</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 480px;
      padding: 16px;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
      color: #38bdf8;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .badge.ready { color: #4ade80; border-color: #22c55e; }
    .badge.running { color: #38bdf8; border-color: #0284c7; }
    .badge.error { color: #f87171; border-color: #ef4444; }

    p.subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
      margin: 0 0 12px 0;
      line-height: 1.3;
    }

    /* Redaction Toggle Styling */
    .toggle-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toggle-label.on { color: #4ade80; }
    .toggle-label.off { color: #f87171; }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ef4444;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(22px); }

    .toggle-warning {
      font-size: 0.72rem;
      color: #fca5a5;
      margin-top: 6px;
      display: none;
      line-height: 1.2;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover { background-color: #0369a1; }
    button:disabled { background-color: #475569; cursor: not-allowed; }

    #status-list {
      font-size: 0.78rem;
      margin-top: 12px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* Debug Panel & Thumbnails */
    #debug-panel {
      margin-top: 14px;
    }
    .timer-badge {
      font-size: 0.8rem;
      font-weight: bold;
      color: #38bdf8;
      background: #1e293b;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #334155;
      margin-bottom: 10px;
    }

    .thumbnails-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .thumb-card {
      flex: 1;
      max-width: 230px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px;
      text-align: center;
    }
    .thumb-card span {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .thumb-card img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #475569;
      cursor: zoom-in;
      transition: transform 0.2s;
    }
    .thumb-card img:hover {
      transform: scale(1.03);
      border-color: #38bdf8;
    }

    /* Modal Image Zoom Overlay */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.95);
      padding: 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .image-modal-close {
      margin-top: 12px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 6px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Detection Table */
    table.detection-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
      margin-top: 8px;
      background-color: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    table.detection-table th {
      background-color: #0f172a;
      color: #38bdf8;
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #334155;
    }
    table.detection-table td {
      padding: 6px 8px;
      border-bottom: 1px solid #334155;
      color: #e2e8f0;
    }
    table.detection-table tr:nth-child(even) {
      background-color: #1e293b;
    }
    table.detection-table tr:nth-child(odd) {
      background-color: #0f172a;
    }
    .status-tag {
      font-weight: 600;
      color: #4ade80;
    }

    #error-message {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 8px;
      line-height: 1.4;
      word-break: break-word;
      background: #450a0a;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #991b1b;
    /* Tab Bar Navigation */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #334155;
      margin-bottom: 12px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 0;
      text-align: center;
    }
    .tab-btn:hover {
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
      background: transparent;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header-row">
    <h1>Betaal</h1>
    <span id="state-badge" class="badge ready">Ready</span>
  </div>
  <p class="subtitle">Sees Everything. Reveals Only What Matters.</p>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="live-view-tab">Live View</button>
    <button class="tab-btn" data-tab="vault-tab">Vault</button>
    <button class="tab-btn" data-tab="notifications-tab">Notifications</button>
  </div>

  <!-- Tab 1: Live View -->
  <div id="live-view-tab" class="tab-content active">
    <div class="toggle-card">
      <div class="toggle-row">
        <span id="toggle-status-text" class="toggle-label on">Redaction: ON</span>
        <label class="switch">
          <input type="checkbox" id="redaction-toggle" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div id="toggle-warning-msg" class="toggle-warning">
        ⚠️ Demo mode: sending unredacted data for comparison purposes only.
      </div>
    </div>

    <div style="margin-bottom: 12px;">
      <input id="goal-input" type="text" placeholder="What should I help you do on this page?" style="width: 100%; padding: 8px 10px; box-sizing: border-box; background-color: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; font-size: 0.85rem; outline: none;">
      <div id="goal-error" style="color: #ef4444; font-size: 0.75rem; margin-top: 4px; display: none;">Please enter a goal before running the agent.</div>
    </div>

    <button id="run-agent-btn">Run Agent</button>

    <div id="status-list"></div>
    <div id="debug-panel"></div>
  </div>

  <!-- Tab 2: Vault -->
  <div id="vault-tab" class="tab-content">
    <div id="vault-list" style="font-size: 0.8rem; color: #cbd5e1;">
      <p style="color: #94a3b8; text-align: center;">No activity recorded in Vault yet.</p>
    </div>
  </div>

  <!-- Tab 3: Notifications -->
  <div id="notifications-tab" class="tab-content">
    <div id="pending-notifications-list" style="margin-bottom: 16px;">
      <p style="color: #94a3b8; font-size: 0.8rem; text-align: center;">No pending interventions.</p>
    </div>
    <div id="resolved-notifications-section" style="border-top: 1px solid #334155; padding-top: 8px;">
      <span style="font-size: 0.75rem; font-weight: bold; color: #94a3b8;">Recent Decisions</span>
      <div id="resolved-notifications-list" style="margin-top: 6px; font-size: 0.78rem; color: #94a3b8;"></div>
    </div>
  </div>

  <!-- Image Zoom Modal -->
  <div id="image-modal" class="image-modal">
    <img id="modal-img" src="" alt="Enlarged View" />
    <button class="image-modal-close" id="close-modal-btn">Close Zoom</button>
  </div>

  <script src="extension/browser-polyfill.js"></script>
  <script src="node_modules/tesseract.js/dist/tesseract.min.js"></script>
  <script src="node_modules/onnxruntime-web/dist/ort.min.js"></script>
  <script src="extension/detection/ocr.js"></script>
  <script src="extension/detection/pii-patterns.js"></script>
  <script src="extension/detection/pii-detector.js"></script>
  <script src="extension/detection/vit-classifier.js"></script>
  <script src="extension/detection/face-detect.js"></script>
  <script src="extension/redaction/redact.js"></script>
  <script src="extension/pipeline.js"></script>
  <script src="extension/network.js"></script>
  <script src="extension/intervention-rules.js"></script>
  <script src="extension/vault.js"></script>
  <script src="popup.js"></script>
</body>
</html>
